spring:
  application:
    name: lms-lite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lms}
    username: ${DB_USERNAME:lms}
    password: ${DB_PASSWORD:lms_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
server:
  port: ${SERVER_PORT:8080}
