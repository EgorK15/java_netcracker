spring:
  application:
    name: lms-lite
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/lms}
    username: ${DB_USERNAME:lms}
    password: ${DB_PASSWORD:lms_local}
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 50
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
